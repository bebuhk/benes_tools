[project]
name = "benes_tools"
version = "0.1.0"
requires-python = ">=3.11"
#dependencies = ["numpy", "jax"] # this is enough for the unit_test on rotations if other import is chosen.
dependencies = [
    "anywidget>=0.11.0",
    "benes-tools",
    "ipykernel>=7.2.0",
    "jax>=0.10.1",
    "jupyterlab>=4.5.7",
    "kaleido>=1.3.0",
    #"kaleido>=0.2.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pymatgen>=2026.3.23",
    "scipy>=1.17.1",
    "si-units>=0.11.4",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
